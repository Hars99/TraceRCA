services:
  provider-simulator:
    build:
      context: .
      dockerfile: services/provider-simulator/Dockerfile
    ports:
      - "${PROVIDER_SIMULATOR_PORT:-4001}:4001"
    environment:
      - PROVIDER_SIMULATOR_PORT=${PROVIDER_SIMULATOR_PORT:-4001}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  incident-engine:
    build:
      context: .
      dockerfile: services/incident-engine/Dockerfile
    ports:
      - "${INCIDENT_ENGINE_PORT:-4002}:4002"
    environment:
      - INCIDENT_ENGINE_PORT=${INCIDENT_ENGINE_PORT:-4002}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo-ai-app:
    build:
      context: .
      dockerfile: apps/demo-ai-app/Dockerfile
    ports:
      - "${DEMO_APP_PORT:-3001}:3001"
    environment:
      - DEMO_APP_PORT=${DEMO_APP_PORT:-3001}
      - PROVIDER_SIMULATOR_URL=http://provider-simulator:4001
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-750}
      - TELEMETRY_MAX_EVENTS=${TELEMETRY_MAX_EVENTS:-5000}
      - INCIDENT_ENGINE_URL=http://incident-engine:4002
    depends_on:
      provider-simulator:
        condition: service_healthy
      incident-engine:
        condition: service_healthy

  replay-engine:
    build:
      context: .
      dockerfile: services/replay-engine/Dockerfile
    ports:
      - "${REPLAY_ENGINE_PORT:-4003}:4003"
    environment:
      - REPLAY_ENGINE_PORT=${REPLAY_ENGINE_PORT:-4003}
      - DEMO_APP_URL=http://demo-ai-app:3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      demo-ai-app:
        condition: service_started

  tracerca-api:
    build:
      context: .
      dockerfile: apps/tracerca-api/Dockerfile
    ports:
      - "${TRACERCA_API_PORT:-4004}:4004"
    environment:
      - TRACERCA_API_PORT=${TRACERCA_API_PORT:-4004}
      - INCIDENT_ENGINE_URL=http://incident-engine:4002
      - REPLAY_ENGINE_URL=http://replay-engine:4003
      - DEMO_APP_URL=http://demo-ai-app:3001
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-5000}
      - REPLAY_UPSTREAM_TIMEOUT_MS=${REPLAY_UPSTREAM_TIMEOUT_MS:-15000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      incident-engine:
        condition: service_healthy
      replay-engine:
        condition: service_healthy
      demo-ai-app:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TRACERCA_API_URL=http://tracerca-api:4004
    depends_on:
      tracerca-api:
        condition: service_healthy
